<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <!-- PdfToSvg 全体アーキテクチャ図（正典）。変更後は docs/_build/svg2png.py で PNG を再生成する。 -->
  <style>
    text { font-family: 'BIZ UDPGothic', sans-serif; fill: #20242C; }
    .mono { font-family: 'BIZ UDGothic', monospace; }
    .name { font-size: 19px; font-weight: bold; }
    .desc { font-size: 15px; fill: #606874; }
    .item { font-size: 16px; }
    .small { font-size: 14px; fill: #606874; }
    .note { font-size: 15px; fill: #606874; }
    .box { fill: #FFFFFF; stroke: #1F5C99; stroke-width: 2; }
    .panel { fill: #F4F6F8; stroke: #DCE3EA; stroke-width: 1.5; }
    .edge { stroke: #1F5C99; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .edge2 { stroke: #1F5C99; stroke-width: 2.5; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5C99"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>

  <!-- 変換パイプライン（縦流れ） -->
  <rect class="panel" x="70" y="40" width="440" height="72" rx="8"/>
  <text class="name" x="290" y="84" text-anchor="middle">PDF（入力）</text>

  <rect class="box" x="70" y="142" width="440" height="72" rx="8"/>
  <text class="name mono" x="100" y="172">engine</text>
  <text class="desc" x="100" y="198">PyMuPDF 抽出 + vector / scan ページ判定</text>

  <rect class="box" x="70" y="244" width="440" height="72" rx="8"/>
  <text class="name mono" x="100" y="274">model</text>
  <text class="desc" x="100" y="300">Document / Page / Element（モデルが真実）</text>

  <rect class="box" x="70" y="346" width="440" height="72" rx="8"/>
  <text class="name mono" x="100" y="376">dictionary</text>
  <text class="desc" x="100" y="402">NFKC 正規化照合・折返し連結・明示操作で適用（Undo 可）</text>

  <rect class="box" x="70" y="448" width="440" height="72" rx="8"/>
  <text class="name mono" x="100" y="478">export</text>
  <text class="desc" x="100" y="504">モデル → SVG の決定的シリアライズ</text>

  <rect class="panel" x="70" y="550" width="440" height="72" rx="8"/>
  <text class="name" x="290" y="594" text-anchor="middle">SVG（出力・画面プレビュー）</text>

  <line class="edge" x1="290" y1="114" x2="290" y2="136"/>
  <line class="edge" x1="290" y1="216" x2="290" y2="238"/>
  <line class="edge" x1="290" y1="318" x2="290" y2="340"/>
  <line class="edge" x1="290" y1="420" x2="290" y2="442"/>
  <line class="edge" x1="290" y1="522" x2="290" y2="544"/>

  <!-- Web サーバと Edge アプリ窓 -->
  <rect class="box" x="600" y="244" width="300" height="176" rx="8"/>
  <text class="name mono" x="750" y="290" text-anchor="middle">web.server</text>
  <text class="item" x="750" y="322" text-anchor="middle">127.0.0.1 ローカル HTTP</text>
  <text class="item mono" x="750" y="352" text-anchor="middle">/rpc・/upload・/quit・/ping</text>
  <text class="small" x="750" y="382" text-anchor="middle">同一オリジン検査・コマンド + Undo スタック</text>

  <rect class="box" x="970" y="244" width="200" height="176" rx="8"/>
  <text class="name" x="1070" y="300" text-anchor="middle">Edge アプリ窓</text>
  <text class="item mono" x="1070" y="336" text-anchor="middle">resources/web</text>
  <text class="small" x="1070" y="366" text-anchor="middle">index.html + JS 7 本</text>

  <line class="edge2" x1="518" y1="304" x2="592" y2="304"/>
  <line class="edge2" x1="908" y1="332" x2="962" y2="332"/>

  <text class="note" x="70" y="660">設計原則「モデルが真実」: 編集は /rpc からコマンドを Undo スタックへ push してモデルを更新し、SVG はモデルから直接書き出す。</text>
</svg>
